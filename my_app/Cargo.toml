[package]
name = "multi_agent_flow"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "multi_agent_flow"
path = "src/main.rs"

[lib]
name = "multi_agent_flow_lib"
path = "src/lib.rs"

[dependencies]
scaffold-runtime = { path = "../scaffold-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2.0"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
