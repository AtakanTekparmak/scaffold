[workspace]
resolver = "2"
members = [
    "crates/scaffold-syntax",
    "crates/scaffold-types",
    "crates/scaffold-ir",
    "crates/scaffold-verify",
    "crates/scaffold-runtime",
    "crates/scaffold-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["andthattoo", "claude"]
license = "MIT"

[workspace.dependencies]
# Parsing
logos = "0.14"

# Error reporting
ariadne = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Graph analysis
petgraph = "0.6"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Internal crates
scaffold-syntax = { path = "crates/scaffold-syntax" }
scaffold-types = { path = "crates/scaffold-types" }
scaffold-ir = { path = "crates/scaffold-ir" }
scaffold-verify = { path = "crates/scaffold-verify" }
scaffold-runtime = { path = "crates/scaffold-runtime" }

# Error handling
thiserror = "1.0"
