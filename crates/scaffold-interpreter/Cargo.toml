[package]
name = "scaffold-interpreter"
version.workspace = true
edition.workspace = true
description = "Interpreter for scaffold language - executes .scaffold files directly"

[dependencies]
scaffold-syntax.workspace = true
scaffold-types.workspace = true
scaffold-ir.workspace = true
scaffold-runtime.workspace = true
scaffold-verify.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"

# Async runtime for LLM calls
tokio = { version = "1.0", features = ["full"] }

# File watching for hot-reload
notify = "6.0"
